kind = "web"
previewPath = "/"
title = "Ariyan’s Birthday Wish"
description = "A polished white-and-pink animated birthday greeting page for Ariyan Shanto, featuring his photo, birthday details, celebratory motion, and animated GIFs."
version = "1.0.0"
id = "artifacts/ariyan-birthday"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19466

[services.development]
run = "pnpm --filter @workspace/ariyan-birthday run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ariyan-birthday", "run", "build" ]
serve = "static"
publicDir = "artifacts/ariyan-birthday/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19466"
BASE_PATH = "/"
